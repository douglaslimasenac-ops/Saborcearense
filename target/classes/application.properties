# H2 em memória para desenvolvimento. Sem DATABASE_URL, os dados são perdidos ao reiniciar.
spring.datasource.url=jdbc:h2:mem:sabor_cearense;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do Hibernate otimizada para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Em produção configure DATABASE_URL para PostgreSQL e mantenha JPA_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Desativa o aviso chato de open-in-view para aliviar a memória no plano gratuito do Render
spring.jpa.open-in-view=false

# 🛠️ CORREÇÃO DEFINITIVA: Desativa completamente a busca e execução do arquivo data.sql externo
spring.sql.init.mode=never

# Comprovantes Pix enviados pelo checkout
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logs para acompanhamento das queries de inserção no console do Render
spring.jpa.show-sql=true

# 🌟 CONFIGURAÇÃO WEB: Permite que o Thymeleaf sirva os arquivos HTML da pasta static diretamente
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/static/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Ativa o painel visual do banco H2 para testes estruturais
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configure ADMIN_PASSWORD e, se necessario, APP_ALLOWED_ORIGINS no ambiente de producao.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080,https://saborcearense-5.onrender.com}
