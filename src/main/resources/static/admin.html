<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Sabor Cearense</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #fffcf5; color: #111111; font-family: Arial, sans-serif; padding: 20px; }
        .container-admin { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2, h3 { border-bottom: 2px solid #f5a623; padding-bottom: 8px; }
        .form-grupo { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-grupo label { font-weight: bold; margin-bottom: 5px; }
        .form-grupo input, .form-grupo select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-acao { background-color: #f5a623; color: #111111; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; font-size: 1rem; }
        .btn-acao:hover { background-color: #e0941f; }
        .item-gerenciamento { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-status { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-status.esgotado { background: #e74c3c; }
        .btn-deletar { background: #95a5a6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .btn-deletar:hover { background: #c0392b; }
        #login-admin { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DE SEGURANÇA -->
    <div id="login-admin">
        <h2>🔒 Login do Administrador</h2>
        <div class="form-grupo">
            <label>Usuário:</label>
            <input type="text" id="usuario-login">
        </div>
        <div class="form-grupo">
            <label>Senha:</label>
            <input type="password" id="senha-login">
        </div>
        <button class="btn-acao" onclick="autenticarAdmin()">Entrar no Painel</button>
    </div>

    <!-- PAINEL PRINCIPAL (ESCONDIDO ATÉ FAZER LOGIN) -->
    <div id="conteudo-painel" class="container-admin" style="display: none;">
        <h2>⚙ Painel do Administrador - Sabor Cearense</h2>
        <p><a href="index.html" style="color: #f5a623; font-weight: bold; text-decoration: none;">← Ir para o Cardápio Visual</a></p>

        <!-- CADASTRAR NOVO ITEM -->
        <h3>➕ Cadastrar Novo Prato ou Bebida</h3>
        <form id="form-novo-prato">
            <div class="form-grupo">
                <label for="nome">Nome do Item:</label>
                <input type="text" id="nome" required placeholder="Ex: Guaraná Antártica Latão / Prato Feito de Carne">
            </div>
            <div class="form-grupo">
                <label for="preco">Preço (R\$):</label>
                <input type="number" step="0.01" id="preco" required placeholder="Ex: 6.00">
            </div>
            <div class="form-grupo">
                <label for="descricao">Categoria no Cardápio:</label>
                <select id="descricao" required>
                    <option value="PRATOS_DO_DIA">🌹 Pratos do Dia</option>
                    <option value="FRANGO">🐔 Pratos Principais - Frango</option>
                    <option value="CARNE">🥩 Pratos Principais - Carne</option>
                    <option value="OUTROS">🐟 Pratos Principais - Outros</option>
                    <option value="SOBREMESA">😋 Sobremesas</option>
                    <option value="BEBIDA">🥤 Bebidas Geladas</option>
                </select>
            </div>
            <button type="submit" class="btn-acao">Salvar no Cardápio 🌵</button>
        </form>

        <!-- LISTA DE ITENS CADASTRADOS -->
        <h3 style="margin-top: 40px;">📋 Gerenciar Itens Cadastrados</h3>
        <div id="lista-itens-admin">Carregando itens...</div>
    </div>
    <script>
        const URL_BACKEND = "https://onrender.com";

        function autenticarAdmin() {
            const u = document.getElementById("usuario-login").value;
            const s = document.getElementById("senha-login").value;
            if(u === "admin" && s === "sabor123") {
                document.getElementById("login-admin").style.display = "none";
                document.getElementById("conteudo-painel").style.display = "block";
                carregarItensAdmin();
            } else {
                alert("Usuário ou senha incorretos!");
            }
        }

        async function carregarItensAdmin() {
            const container = document.getElementById("lista-itens-admin");
            try {
                const res = await fetch(URL_BACKEND + "/api/cardapio");
                const itens = await res.json();
                container.innerHTML = "";

                if(itens.length === 0) {
                    container.innerHTML = "<p>Nenhum item cadastrado.</p>";
                    return;
                }

                itens.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "item-gerenciamento";
                    div.innerHTML = `
                        <div>
                            <strong>${item.nome}</strong> <small style="color: #777;">(${item.descricao})</small><br>
                            <span style="color: #27ae60; font-weight:bold;">R$ ${item.preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div>
                            <button class="btn-status ${item.esgotado ? 'esgotado' : ''}" onclick="alternarDisponibilidade(${item.id}, ${item.esgotado})">
                                ${item.esgotado ? '🔴 Esgotado' : '🟢 Disponível'}
                            </button>
                            <button class="btn-deletar" onclick="deletarItem(${item.id})">🗑 Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { container.innerHTML = "<p>Erro ao carregar itens do servidor.</p>"; }
        }

        document.getElementById("form-novo-prato").addEventListener("submit", async (e) => {
            e.preventDefault();
            const nome = document.getElementById("nome").value;
            const preco = parseFloat(document.getElementById("preco").value);
            const descricao = document.getElementById("descricao").value;

            try {
                const res = await fetch(URL_BACKEND + "/api/cardapio/novo", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome, preco, descricao, esgotado: false })
                });

                if(res.ok) {
                    alert("Item adicionado com sucesso!");
                    document.getElementById("form-novo-prato").reset();
                    carregarItensAdmin();
                } else { alert("Erro ao salvar item."); }
            } catch(err) { alert("Não foi possível conectar ao servidor backend."); }
        });

        async function alternarDisponibilidade(id, statusAtual) {
            try {
                const res = await fetch(`${URL_BACKEND}/api/cardapio/${id}/status-disponibilidade`, {
                    method: "PUT"
                });
                if(res.ok) carregarItensAdmin();
            } catch(e) { alert("Erro ao alterar status."); }
        }

        async function deletarItem(id) {
            if(!confirm("Tem certeza que deseja excluir este item do cardápio permanentemente?")) return;
            try {
                const res = await fetch(`${URL_BACKEND}/api/cardapio/${id}/deletar`, {
                    method: "DELETE"
                });
                if(res.ok) carregarItensAdmin();
            } catch(e) { alert("Erro ao deletar item."); }
        }
    </script>
</body>
</html>
