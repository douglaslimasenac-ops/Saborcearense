<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Sabor Cearense</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #f5f6fa; color: #333; }
        .container-admin { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #2c3e50; }
        .btn-voltar { display: inline-block; margin-bottom: 20px; color: #e67e22; text-decoration: none; font-weight: bold; }
        .form-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #e67e22; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #d35400; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .btn-acao { padding: 6px 12px; font-size: 0.85rem; margin-right: 5px; }
        .btn-save { background: #2ecc71; }
        .btn-save:hover { background: #27ae60; }
        .btn-status { background: #3498db; }
        .btn-status.esgotado { background: #95a5a6; }
        .btn-delete { background: #e74c3c; }
        .btn-delete:hover { background: #c0392b; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .status-disponivel { background: #e8f8f5; color: #2ecc71; }
        .status-esgotado { background: #fce4e4; color: #e74c3c; }
        .input-table { border: 1px solid transparent; padding: 6px; background: transparent; font-size: 0.95rem; width: 100%; }
        .input-table:focus { border-color: #ddd; background: #fff; outline: none; }
    </style>
</head>
<body>
    <div class="container-admin">
        <h1>Painel do Administrador - Sabor Cearense</h1>
        <a href="index.html" class="btn-voltar">← Voltar para o Cardápio</a>

        <div class="form-container">
            <h2>Adicionar Novo Item ao Cardápio</h2>
            <form id="form-prato">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome do Prato:</label>
                        <input type="text" id="nome" required placeholder="Ex: Baião de Dois">
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço (R$):</label>
                        <input type="number" id="preco" step="0.01" required placeholder="0,00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="descricao">Descrição / Acompanhamentos:</label>
                        <textarea id="descricao" rows="2" placeholder="Ex: Arroz, feijão de corda..."></textarea>
                    </div>
                </div>
                <button type="submit">Cadastrar Item</button>
            </form>
        </div>

        <h2>Gerenciar Itens Cadastrados</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th style="width: 110px;">Preço</th>
                        <th style="width: 110px;">Status</th>
                        <th style="width: 260px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-pratos">
                </tbody>
            </table>
        </div>
    </div>
        <!-- ÁREA JAVASCRIPT CORRIGIDA - MAPEAMENTO COMPLETO DE CATEGORIAS -->
    <script>
        // URL Oficial do seu projeto hospedado no Render
        const URL_BACKEND = "https://saborcearense-5.onrender.com"; 

        let carrinho = {};

        // Dispara as consultas ao servidor assim que a página termina de carregar
        document.addEventListener("DOMContentLoaded", () => {
            verificarStatusLoja();
            carregarCardapio();
        });

        // 1. ATUALIZA A BARRA DE STATUS DE FUNCIONAMENTO (ABERTO/FECHADO)
        async function verificarStatusLoja() {
            try {
                const resposta = await fetch(URL_BACKEND + "/api/cardapio/status");
                const dadosStatus = await resposta.json();
                document.getElementById("status-loja").innerText = dadosStatus.mensagem;
            } catch (erro) {
                console.error("Erro ao carregar status da loja:", erro);
                document.getElementById("status-loja").innerText = "Não foi possível carregar o status.";
            }
        }

        // 2. CARREGA OS PRATOS FILTRADOS NA ROTA CORRETA DO CLIENTE
        async function carregarCardapio() {
            try {
                const resposta = await fetch(URL_BACKEND + "/api/cardapio");
                const pratos = await resposta.json();

                // Limpa todas as seções mapeadas na tela antes de renderizar
                const secoes = ["PRATOS_DO_DIA", "FRANGO", "CARNE", "OUTROS", "BEBIDA", "SOBREMESA"];
                secoes.forEach(sec => {
                    const el = document.getElementById("section-" + sec);
                    if (el) el.innerHTML = "";
                });

                pratos.forEach(prato => {
                    // Mapeia os pratos baseando-se no campo 'descricao' (onde o Java salva a categoria)
                    let secaoAlvo = prato.descricao; 
                    
                    // Se o prato for rotativo de dias específicos (ex: SEGUNDA, TERCA, SABADO)
                    if (prato.diasDisponiveis && prato.diasDisponiveis !== "TODOS") {
                        secaoAlvo = "PRATOS_DO_DIA";
                    }
                    
                    const container = document.getElementById("section-" + secaoAlvo);
                    if (container) {
                        let controleQuantidadeHTML = "";
                        let classeEsgotado = "";

                        // Verifica se o prato está marcado como esgotado no painel admin
                        if (prato.esgotado) {
                            classeEsgotado = "item-esgotado";
                            controleQuantidadeHTML = `<span class="badge-esgotado">Esgotado</span>`;
                        } else {
                            controleQuantidadeHTML = `
                                <div class="seletor-quantidade">
                                    <button class="btn-qtd" onclick="mudarQuantidade(${prato.id}, -1, ${prato.preco})">-</button>
                                    <span class="qtd-numero" id="qtd-${prato.id}">0</span>
                                    <button class="btn-qtd" onclick="mudarQuantidade(${prato.id}, 1, ${prato.preco})">+</button>
                                </div>
                            `;
                        }

                        container.innerHTML += `
                            <div class="menu-item ${classeEsgotado}" id="item-${prato.id}">
                                <div class="item-info">
                                    <h4>${prato.nome}</h4>
                                    <span class="preco">R$ ${prato.preco.toFixed(2).replace('.', ',')}</span>
                                </div>
                                <div class="item-controles">
                                    ${controleQuantidadeHTML}
                                }
                            </div>
                        `;
                    }
                });
            } catch (erro) {
                console.error("Erro ao carregar cardápio:", erro);
                document.getElementById("status-loja").innerText = "Erro ao carregar o cardápio.";
            }
        }

        function mudarQuantidade(id, alteracao, preco) {
            if (!carrinho[id]) carrinho[id] = { qtd: 0, preco: preco };
            
            carrinho[id].qtd += alteracao;

            if (carrinho[id].qtd <= 0) {
                carrinho[id].qtd = 0;
                document.getElementById(`item-${id}`).classList.remove("selecionado");
            } else {
                document.getElementById(`item-${id}`).classList.add("selecionado");
            }

            document.getElementById(`qtd-${id}`).innerText = carrinho[id].qtd;
            atualizarTotalFlutuante();
        }

        function atualizarTotalFlutuante() {
            let total = 0;
            for (let id in carrinho) {
                total += carrinho[id].qtd * carrinho[id].preco;
            }
            document.getElementById("total-flutuante").innerText = "R\$ " + total.toFixed(2).replace('.', ',');
        }

        async function enviarPedidoParaOZap() {
            try {
                const resposta = await fetch(URL_BACKEND + "/api/pedidos/criar", {
                    method: 'POST'
                });
                
                const pedidoCriado = await resposta.json();
                const pedidoId = pedidoCriado.id; 

                const linkDeConfirmacao = URL_BACKEND + "/api/pedidos/" + pedidoId + "/confirmar";

                let textoWhatsapp = "*NOVO PEDIDO - SABORCEARENSE (#" + pedidoId + ")*\n\n";
                const totalPedido = document.getElementById('total-flutuante').innerText;
                textoWhatsapp += "*Total do Pedido:* " + totalPedido + "\n";
                textoWhatsapp += "\n👉 *CLIQUE AQUI PARA CONFIRMAR O PEDIDO:* " + linkDeConfirmacao;

                localStorage.setItem('idPedidoSaborcearense', pedidoId);

                const numeroRestaurante = "5521969179343"; 
                const urlWhatsappFinal = "https://wa.me" + numeroRestaurante + "?text=" + encodeURIComponent(textoWhatsapp);
                
                window.open(urlWhatsappFinal, '_blank');
                window.location.href = 'acompanhar.html';

            } catch (erro) {
                console.error("Erro ao processar o fluxo do pedido:", erro);
                alert("Ops! Tivemos um problema de conexão com o servidor. Tente finalizar novamente.");
            }
        }
    </script>
</body>
</html>
