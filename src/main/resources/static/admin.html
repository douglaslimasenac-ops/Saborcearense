<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Sabor Cearense</title>
    <style>
        :root {
            --primary: #ea1d2c;
            --dark: #2c3e50;
            --success: #2ecc71;
            --gray: #95a5a6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; color: var(--dark); }
        .btn-voltar {
            text-decoration: none;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        /* Card de status da loja */
        .status-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .status-aberto { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-fechado { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        
        /* Listagem de itens */
        .secao-admin {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .secao-admin h2 { margin-top: 0; color: var(--dark); border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .tabela-pratos { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tabela-pratos th, .tabela-pratos td { padding: 12px; text-align: left; border-bottom: 1px solid #f2f2f2; }
        .tabela-pratos th { background-color: #fafafa; color: #7f8c8d; font-size: 0.85rem; text-transform: uppercase; }
        
        /* Botões de Ação */
        .badge-esgotado {
            background: #fbe7e7;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-disponivel {
            background: #eafaf1;
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .btn-acao {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-esgotar { background-color: #feecee; color: var(--primary); }
        .btn-esgotar:hover { background-color: var(--primary); color: #fff; }
        .btn-ativar { background-color: #eafaf1; color: var(--success); }
        .btn-ativar:hover { background-color: var(--success); color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙ Painel do Administrador</h1>
            <a href="index.html" class="btn-voltar">➔ Voltar para o Cardápio</a>
        </header>

        <!-- Controle de funcionamento em tempo real -->
        <div class="status-card">
            <div class="status-info">
                <span id="admin-status-dot" class="status-dot status-fechado"></span>
                <span id="admin-status-texto">Carregando status do estabelecimento...</span>
            </div>
            <div id="area-botoes-status">
                <!-- Botões injetados dinamicamente via JS -->
            </div>
        </div>

        <!-- Gerenciador do Menu -->
        <div class="secao-admin">
            <h2>Gestão de Itens do Cardápio</h2>
            <table class="tabela-pratos">
                <thead>
                    <tr>
                        <th>Nome do Item</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo-itens">
                    <!-- Itens carregados via API -->
                </tbody>
            </table>
        </div>
    </div>

            <!-- LÓGICA DE INTEGRAÇÃO DO PAINEL ADMINISTRATIVO COM O BACKEND CORRIGIDO -->
    <script>
        const URL_BACKEND = "https://saborcearense-5.onrender.com";

        // Inicializa o painel buscando as informações do servidor
        document.addEventListener("DOMContentLoaded", () => {
            obterStatusLojaAdmin();
            carregarItensAdmin();
        });

        // 1. BUSCA E EXIBE O STATUS DE FUNCIONAMENTO ATUAL DA LOJA
        async function obterStatusLojaAdmin() {
            try {
                const resposta = await fetch(URL_BACKEND + "/api/cardapio/status");
                const dados = await resposta.json();
                
                const dot = document.getElementById("admin-status-dot");
                const texto = document.getElementById("admin-status-texto");
                
                if (dados.aberto) {
                    dot.className = "status-dot status-aberto";
                    texto.innerText = "Sua loja está ABERTA e recebendo pedidos!";
                } else {
                    dot.className = "status-dot status-fechado";
                    texto.innerText = dados.mensagem || "Sua loja está FECHADA no momento.";
                }
            } catch (erro) {
                console.error("Erro ao buscar status no painel:", erro);
                document.getElementById("admin-status-texto").innerText = "Não foi possível se conectar ao servidor.";
            }
        }

        // 2. BUSCA TODOS OS ITENS CADASTRADOS PARA GESTÃO DE DISPONIBILIDADE
        async function carregarItensAdmin() {
            try {
                const resposta = await fetch(URL_BACKEND + "/api/cardapio");
                const pratos = await resposta.json();
                
                const tabelaCorpo = document.getElementById("tabela-corpo-itens");
                tabelaCorpo.innerHTML = ""; // Limpa a tabela

                if (pratos.length === 0) {
                    tabelaCorpo.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999;">Nenhum prato encontrado no banco de dados.</td></tr>`;
                    return;
                }

                pratos.forEach(prato => {
                    const statusHTML = prato.esgotado 
                        ? `<span class="badge-esgotado">Esgotado</span>` 
                        : `<span class="badge-disponivel">Disponível</span>`;
                    
                    const botaoHTML = prato.esgotado
                        ? `<button class="btn-acao btn-ativar" onclick="alternarDisponibilidadePrato(${prato.id}, false)">Reativar Item</button>`
                        : `<button class="btn-acao btn-esgotar" onclick="alternarDisponibilidadePrato(${prato.id}, true)">Marcar Esgotado</button>`;

                    tabelaCorpo.innerHTML += `
                        <tr>
                            <td style="font-weight: 600; color: #2c3e50;">${prato.nome}</td>
                            <td><span style="font-size:0.85rem; background:#eee; padding:3px 8px; border-radius:10px; font-weight:bold;">${prato.descricao}</span></td>
                            <td style="font-weight: 600;">R$ ${prato.preco.toFixed(2).replace('.', ',')}</td>
                            <td>${statusHTML}</td>
                            <td style="text-align: right;">${botaoHTML}</td>
                        </tr>
                    `;
                });
            } catch (erro) {
                console.error("Erro ao listar pratos no admin:", erro);
                document.getElementById("tabela-corpo-itens").innerHTML = `
                    <tr><td colspan="5" style="text-align:center; color:#c0392b; font-weight:bold;">Erro ao carregar os itens do servidor.</td></tr>
                `;
            }
        }

        // 3. ALTERNA O STATUS DE DISPONIBILIDADE (ESGOTADO) NO BACKEND
        async function alternarDisponibilidadePrato(id, marcarComoEsgotado) {
            try {
                // Rota configurada mapeando o ID do item para atualizar seu estado lógico
                const urlToken = marcarComoEsgotado ? "/esgotar" : "/ativar";
                
                // Caso o seu backend use uma rota PUT genérica envie desta forma, 
                // se usar uma rota direta ajustamos ela aqui:
                const resposta = await fetch(`${URL_BACKEND}/api/cardapio/${id}${urlToken}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });

                // Se a sua API atualizar direto enviando o objeto completo pelo corpo:
                if (!resposta.ok) {
                    // Fallback automático caso sua rota atualize pelo endpoint genérico de salvar:
                    await fetch(`${URL_BACKEND}/api/cardapio/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id, esgotado: marcarComoEsgotado })
                    });
                }

                // Atualiza a listagem na tela do administrador instantaneamente
                carregarItensAdmin();
            } catch (erro) {
                console.error("Erro ao mudar status do prato:", erro);
                alert("Não foi possível atualizar o status do item. Verifique a conexão.");
            }
        }
    </script>
</body>
</html>
