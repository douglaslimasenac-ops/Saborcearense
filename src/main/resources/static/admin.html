<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Executiva - Sabor Cearense</title>
    <!-- FontAwesome para os ícones originais -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary: #f5a623;
            --primary-hover: #e0941f;
            --dark: #111111;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --text-muted: #64748b;
        }

        body { 
            background-color: var(--bg); 
            color: var(--dark); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0;
            min-height: 100vh;
        }

        /* Garante o emparelhamento perfeito da barra lateral com o painel */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        /* Menu Lateral Corporativo Fixo na Esquerda */
        aside {
            width: 260px;
            background: var(--dark);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 30px 15px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
            min-height: 100vh;
        }
        aside h2 {
            font-size: 1.4rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 35px;
            font-weight: 900;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .nav-link.active {
            background: var(--primary);
            color: var(--dark);
        }

        main { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto;
            background-color: #fcfcfc;
        }
        
        .section-view { 
            display: none; 
        }
        .section-view.active { 
            display: block; 
        }
        .admin-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 35px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h3 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; font-weight: 800; color: #1e293b; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            gap: 20px;
            align-items: end;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 35px;
        }

        /* Centralizador para a caixa de login */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }

        #login-admin { 
            width: 100%;
            max-width: 380px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0; 
        }

        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-grupo { display: flex; flex-direction: column; }
        .form-grupo label { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #475569; }
        .form-grupo input, .form-grupo select { 
            padding: 12px 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fff;
        }

        .grid-produtos { display: flex; flex-direction: column; gap: 14px; }
        
        .card-produto { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            background: #fff;
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            transition: all 0.2s;
        }
        .card-produto:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
        .card-produto.esgotado-style { background: #f8fafc; border-left: 5px solid var(--text-muted); opacity: 0.75; }
        .card-produto.disponivel-style { border-left: 5px solid var(--success); }

        .card-pedido {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            border-left: 6px solid var(--primary);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .btn-acao { 
            background-color: var(--primary); 
            color: var(--dark); 
            border: none; 
            padding: 14px 24px; 
            font-weight: 700; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-status-toggle { 
            border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .btn-status-toggle.ativo { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .btn-status-toggle.inativo { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        
        .badge-cat {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            margin-left: 5px;
        }
        .input-preco-rapido {
            width: 80px;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- CONTAINER DA TELA DE LOGIN -->
    <div class="login-wrapper" id="container-login-view">
        <div id="login-admin">
            <h2 style="text-align: center; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;">🔒 Gestão Executiva</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 30px;">Sabor Cearense Delivery</p>
            <div class="form-grupo" style="margin-bottom: 15px;">
                <label>Usuário Administrativo</label>

            <button class="btn-acao" onclick="autenticarAdmin()" style="width: 100%; justify-content: center; display: flex;">Autenticar no Painel</button>

    </div>

    <!-- WRAPPER DO PAINEL PRINCIPAL -->
    <div class="admin-wrapper" id="painel-adm-wrapper" style="display: none;">
        
            <aside id="menu-lateral" style="position: relative;">
        <h2>Sabor Cearense</h2>
        <div class="nav-link active" id="tab-ativos" onclick="alternarAbasAdmin('ativos')"><i class="fas fa-motorcycle"></i> Em Andamento</div>
        <div class="nav-link" id="tab-historico" onclick="alternarAbasAdmin('historico')"><i class="fas fa-clock-rotate-left"></i> Histórico / Finalizados</div>
        <div class="nav-link" id="tab-cardapio" onclick="alternarAbasAdmin('cardapio')"><i class="fas fa-utensils"></i> Alteração do Cardápio</div>
        
        <!-- Bloco fixado na base com linha divisória corporativa -->
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 15px; background: var(--dark); border-top: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;">
            <a href="index.html?admin=1" class="nav-link" style="color: var(--primary); background: rgba(255,255,255,0.03); font-weight: bold; margin-bottom: 0; justify-content: center;">
                <i class="fas fa-shop"></i> Ver Cardápio
            </a>
        </div>
    </aside>


        <main id="conteudo-painel">
            
            <!-- ABA 1: PEDIDOS EM ANDAMENTO -->
            <section id="sec-ativos" class="section-view active">
                <div class="admin-header">
                    <h2>🛵 Pedidos em Andamento (Tempo Real)</h2>
                </div>
                <div id="lista-pedidos-ativos" style="display: flex; flex-direction: column; gap: 15px;"></div>
            </section>

            <!-- ABA 2: HISTÓRICO DE FINALIZADOS -->
            <section id="sec-historico" class="section-view">
                <div class="admin-header">
                    <h2>✅ Histórico de Pedidos Finalizados</h2>
                </div>
                <div id="lista-pedidos-finalizados" style="display: flex; flex-direction: column; gap: 15px;"></div>

            <!-- ABA 3: ALTERAÇÃO DO CARDÁPIO -->
            <section id="sec-cardapio" class="section-view">
                <div class="admin-header">
                    <h2>📋 Produtos Cadastrados e Alteração Ágil</h2>
                </div>
                
                <h3>➕ Adicionar Novo Item</h3>
                <form id="form-novo-prato" class="form-grid">
                    <div class="form-grupo">
                        <label for="nome">Nome do Item</label>
                        <input type="text" id="nome" required placeholder="Ex: Baião de Dois">
                    </div>
                    <div class="form-grupo">
                        <label for="preco">Preço de Venda (R$)</label>

                            <option value="FRANGO">🐔 Pratos Principais - Frango</option>
                            <option value="CARNE">🥩 Pratos Principais - Carne</option>
                            <option value="OUTROS">🐟 Pratos Principais - Outros</option>
                            <option value="SOBREMESA">😋 Sobremesas</option>

                        </select>
                    </div>
                    <div style="grid-column: span 4; text-align: right; margin-top: 10px;">

                <div id="lista-itens-admin" class="grid-produtos"></div>
            </section>
        </main>
    </div>
    <script>
        const URL_BACKEND_WS = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host;
        let socketAdmin;

        const dicionarioCategorias = {
            "PRATOS_DO_DIA": "🌹 Prato do Dia",
            "FRANGO": "🐔 Frango",
            "CARNE": "🥩 Carne",
            "OUTROS": "🐟 Outros Pratos",
            "SOBREMESA": "😋 Sobremesa",
            "BEBIDA": "🥤 Bebida Gelada"
        };

        function autenticarAdmin() {
            const u = document.getElementById("usuario-login").value.trim();
            const s = document.getElementById("senha-login").value.trim();
            if(u === "admin" && s === "sabor123") {
                localStorage.setItem("adminAutenticado", "true");
                
                document.getElementById("container-login-view").style.display = "none";
                document.getElementById("painel-adm-wrapper").style.display = "flex";
                
                carregarItensAdmin();
                inicializarControlePedidos();
                configurarFormularioCadastro();
            } else {
                alert("Usuário ou senha incorretos!");
            }
        }

        function alternarAbasAdmin(abaAlvo) {
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.querySelectorAll('.section-view').forEach(view => view.classList.remove('active'));
            
            document.getElementById(`tab-${abaAlvo}`).classList.add('active');
            document.getElementById(`sec-${abaAlvo}`).classList.add('active');
            
            if (abaAlvo === 'ativos' || abaAlvo === 'historico') {
                carregarPedidosAtivos();
            }
        }

        function configurarFormularioCadastro() {
            document.getElementById("form-novo-prato").onsubmit = async function(e) {
                e.preventDefault();
                const nome = document.getElementById("nome").value;
                const preco = parseFloat(document.getElementById("preco").value);
                const categoria = document.getElementById("categoria").value;
                const imagemUrl = document.getElementById("imagem").value;

                try {
                    const res = await fetch(URL_BACKEND + "/api/admin/pratos", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ nome, preco, categoria, imagemUrl, descricao: "Item profissional.", disponivel: true })
                    });

                    if(res.ok) {
                        document.getElementById("form-novo-prato").reset();
                        carregarItensAdmin();
                    } else { alert("Erro ao criar novo produto."); }
                } catch(err) { alert("Erro de conexão ao salvar."); }
            };
        }

        async function carregarItensAdmin() {
    const container = document.getElementById("lista-itens-admin");
    try {
        const res = await fetch(URL_BACKEND + "/api/cardapio");
        const itens = await res.json();
        
        // 🌟 CORREÇÃO AQUI: Salva os pratos vindos do banco na nossa variável global
        // para que as funções de preço e disponibilidade possam usar os dados completos!
        listaPratosLocal = itens;
        
        container.innerHTML = "";
        
        // --- DAQUI PARA BAIXO O SEU CÓDIGO CONTINUA ORIGINAL ---
        // O seu loop que monta as linhas da tabela administrativa segue normal...

                itens.forEach(item => {
                    const div = document.createElement("div");
                    const esgotado = !item.disponivel;
                    div.className = `card-produto ${esgotado ? 'esgotado-style' : 'disponivel-style'}`;
                    
                    const nomeCategoria = dicionarioCategorias[item.categoria] || item.categoria || "Geral";

                    div.innerHTML = `
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <img src="${item.imagemUrl || 'https://unsplash.com'}" 
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc;">
                            <div class="info-prod">
                                <h4>${item.nome} <span class="badge-cat">${nomeCategoria}</span></h4>
                                <div style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #4a5568;">
                                    <span>Preço: R$</span>
                                    <input type="number" step="0.01" value="${Number(item.preco || 0).toFixed(2)}" 
                                        class="input-preco-rapido" 
                                        onchange="atualizarPrecoRapido(${item.id}, this.value)">
                                </div>
                            </div>
                        </div>
                        <div class="controles-prod">
                            <button class="btn-status-toggle ${esgotado ? 'inativo' : 'ativo'}" 
                                onclick="alternarDisponibilidade(${item.id}, ${item.disponivel})">
                                ${esgotado ? '🔴 Esgotado' : '🟢 Disponível'}
                            </button>
                            <button class="btn-mini-deletar" onclick="deletarItem(${item.id})">🗑️</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { container.innerHTML = `<p style="text-align: center; color: var(--danger);">Erro ao carregar o cardápio.</p>`; }
        }

       // 🌟 CORREÇÃO 1: Rota base exata mapeada no seu AdminPratoController.java
const URL_BACKEND = "https://saborcearense-5.onrender.com";
const URL_API_ADMIN = `${URL_BACKEND}/api/admin/pratos`;

// Armazena temporariamente os pratos carregados para podermos ler os dados antigos antes de atualizar
let listaPratosLocal = [];

// NOTA: Na sua função existente 'carregarItensAdmin' ou 'carregarCardapioAdmin', 
// logo após receber a lista do fetch, adicione: listaPratosLocal = dadosRecebidos;

async function atualizarPrecoRapido(id, novoPreco) {
    const valorFormatado = parseFloat(novoPreco);
    if (isNaN(valorFormatado) || valorFormatado < 0) return;

    // 1. Encontra o prato atual na nossa lista local para pegar o Nome, Descrição, etc.
    const pratoAntigo = listaPratosLocal.find(p => p.id === id) || {};

    try {
        // 2. Envia o objeto COMPLETO exigido pelo Spring Boot, alterando apenas o preço
        const res = await fetch(`${URL_API_ADMIN}/${id}`, { 
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ 
                id: id,
                nome: pratoAntigo.nome || "",
                descricao: pratoAntigo.descricao || "",
                categoria: pratoAntigo.categoria || "",
                imagemUrl: pratoAntigo.imagemUrl || "",
                disponivel: pratoAntigo.disponivel !== undefined ? pratoAntigo.disponivel : true,
                preco: valorFormatado // Novo preço injetado aqui
            })
        });
        
        if (res.ok) {
            carregarItensAdmin();
        } else {
            console.error(`Erro ${res.status} ao atualizar preço.`);
            alert("Erro ao salvar o novo preço no servidor.");
        }
    } catch(err) { 
        alert("Erro de conexão ao alterar preço."); 
    }
}

async function alternarDisponibilidade(id, statusAtual) {
    try {
        const novoStatus = !statusAtual;
        // 1. Encontra o prato atual na nossa lista local para manter os dados idênticos
        const pratoAntigo = listaPratosLocal.find(p => p.id === id) || {};
        
        // 2. Envia o objeto COMPLETO, alterando apenas o status de disponibilidade
        const res = await fetch(`${URL_API_ADMIN}/${id}`, { 
            method: "PUT", 
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ 
                id: id,
                nome: pratoAntigo.nome || "",
                descricao: pratoAntigo.descricao || "",
                categoria: pratoAntigo.categoria || "",
                imagemUrl: pratoAntigo.imagemUrl || "",
                preco: pratoAntigo.preco || 0,
                disponivel: novoStatus // Novo status injetado aqui
            })
        });
        
        if (res.ok) {
            carregarItensAdmin();
        } else {
            console.error(`Erro ${res.status} ao mudar disponibilidade.`);
            alert("Erro ao atualizar a disponibilidade no servidor.");
        }
    } catch(e) { 
        alert("Erro ao mudar disponibilidade."); 
    }
}

async function deletarItem(id) {
    if (!confirm("Deseja apagar esse item permanentemente?")) return;
    try {
        // Mapeado perfeitamente para o seu @DeleteMapping("/{id}") que retorna noContent (204)
        const res = await fetch(`${URL_API_ADMIN}/${id}`, { 
            method: "DELETE" 
        });
        
        if (res.ok || res.status === 204) {
            carregarItensAdmin();
        } else {
            console.error(`Erro ${res.status} ao deletar.`);
            alert("Erro ao excluir o item. Verifique se ele não está em algum pedido.");
        }
    } catch(e) { 
        alert("Erro ao deletar."); 
    }
}


// Mantido original para o fluxo do WebSocket
function inicializarControlePedidos() {
    conectarWebSocketAdmin();
    carregarPedidosAtivos();
}

        function conectarWebSocketAdmin() {
            try {
                socketAdmin = new WebSocket(`${URL_BACKEND_WS}/ws-status`);
                socketAdmin.onmessage = () => { carregarPedidosAtivos(); };
                socketAdmin.onclose = () => { setTimeout(conectarWebSocketAdmin, 5000); };
            } catch (e) { console.error("Falha ao abrir canal WebSocket:", e); }
        }

        // 🌟 TRAVA GLOBAL ANTIDUPLICAÇÃO (Coloque logo acima da função)
// 🌟 TRAVA GLOBAL ANTIDUPLICAÇÃO
let carregandoPedidosAtivos = false;

async function carregarPedidosAtivos() {
    if (carregandoPedidosAtivos) return;
    carregandoPedidosAtivos = true;

    const containerAtivos = document.getElementById("lista-pedidos-ativos");
    const containerHistorico = document.getElementById("lista-pedidos-finalizados");
    
    if (containerAtivos) containerAtivos.innerHTML = "";
    if (containerHistorico) containerHistorico.innerHTML = "";

    try {
        const resAtivos = await fetch(URL_BACKEND + "/api/pedidos/ativos");
        if (resAtivos.ok) {
            const pedidosAtivos = await resAtivos.json();
            let temAtivos = false;

            pedidosAtivos.forEach(pedido => {
                if (pedido.status === 'ENTREGUE') return;
                temAtivos = true;

                const card = document.createElement("div");
                card.className = "card-pedido";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h4 style="margin: 0 0 6px 0; color: #1e293b;">📋 Pedido #${pedido.id} - Cliente: ${pedido.clienteNome || pedido.nomeCliente}</h4>
                            <small style="color: var(--text-muted); display: block; margin-bottom: 4px; font-size: 0.9rem;">📍 Endereço: ${pedido.endereco}</small>
                            <small style="color: #0f766e; font-weight: 700; font-size: 0.9rem;">💳 Forma de Pagamento: ${pedido.formaPagamento}</small>
                        </div>
                        <span class="badge-cat" style="background: #fffbeb; color: #b45309; border-color: #fde68a;">Status: ${pedido.status}</span>
                    </div>
                    <div style="border-top: 1px solid #f1f5f9; padding-top: 14px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button class="btn-status-toggle ativo" style="background: #eff6ff; color: #1e40af; border-color: #bfdbfe;" onclick="mudarStatusPedido(${pedido.id}, 'PREPARO')">👨‍🍳 Preparar</button>
                        <button class="btn-status-toggle ativo" style="background: #f0fdf4; color: #166534; border-color: #bbf7d0;" onclick="mudarStatusPedido(${pedido.id}, 'ENTREGA')">🛵 Despachar</button>
                        <button class="btn-status-toggle inativo" style="background: #f8fafc; color: #1e293b; border-color: #cbd5e1;" onclick="mudarStatusPedido(${pedido.id}, 'ENTREGUE')">✅ Finalizar</button>
                    </div>
                `;
                if (containerAtivos) containerAtivos.appendChild(card);
            });

            if (!temAtivos && containerAtivos) {
                containerAtivos.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px; background: #f8fafc; border-radius: 10px; border: 2px dashed #e2e8f0; margin: 0;">Nenhum pedido em andamento.</p>`;
            }
        }
    } catch (e) { console.log("Erro ao carregar pedidos ativos:", e); }

    try {
        const resTodos = await fetch(URL_BACKEND + "/api/pedidos");
        if (resTodos.ok) {
            const todosPedidos = await resTodos.json();
            let temFinalizados = false;

            todosPedidos.forEach(pedido => {
                if (pedido.status !== 'ENTREGUE') return;
                temFinalizados = true;

                const card = document.createElement("div");
                card.className = "card-pedido";
                card.style.borderLeft = "5px solid var(--success)";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h4 style="margin: 0 0 6px 0; color: #1e293b;">✅ Pedido #${pedido.id} - Cliente: ${pedido.clienteNome || pedido.nomeCliente}</h4>
                            <small style="color: var(--text-muted); display: block; margin-bottom: 4px; font-size: 0.9rem;">📍 Endereço: ${pedido.endereco}</small>
                            <small style="color: #475569; font-size: 0.9rem;">💳 Pago via: ${pedido.formaPagamento}</small>
                        </div>
                        <span class="badge-cat" style="background: #e6f4ea; color: #137333; border-color: #ceead6;">Status: ENTREGUE</span>
                    </div>
                `;
                if (containerHistorico) containerHistorico.appendChild(card);
            });

            if (!temFinalizados && containerHistorico) {
                containerHistorico.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px; background: #f8fafc; border-radius: 10px; border: 2px dashed #e2e8f0; margin: 0;">Nenhum pedido finalizado no histórico.</p>`;
            }
        }
    } catch (e) { console.log("Erro ao carregar histórico de finalizados:", e); }

    carregandoPedidosAtivos = false;
}

// 🌟 FUNÇÃO QUE ESTAVA FALTANDO (Adicionada de volta)
async function mudarStatusPedido(id, novoStatus) {
    try {
        const res = await fetch(`${URL_BACKEND}/api/pedidos/${id}/status?status=${novoStatus}`, { method: "PUT" });
        if (res.ok) {
            carregarPedidosAtivos();
            if (socketAdmin && socketAdmin.readyState === WebSocket.OPEN) {
                socketAdmin.send(JSON.stringify({ id, status: novoStatus }));
            }
        } else {
            alert("Não foi possível atualizar o status do pedido.");
        }
    } catch (e) { 
        console.error("Erro ao mudar status do pedido:", e);
    }
}
