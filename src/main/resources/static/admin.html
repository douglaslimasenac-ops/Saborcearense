<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Executiva - Sabor Cearense</title>
    <!-- FontAwesome para os ícones originais -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary: #f5a623;
            --primary-hover: #e0941f;
            --dark: #111111;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --text-muted: #64748b;
        }

        body { 
            background-color: var(--bg); 
            color: var(--dark); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0;
            min-height: 100vh;
        }

        /* Garante o emparelhamento perfeito da barra lateral com o painel */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        /* Menu Lateral Corporativo Fixo na Esquerda */
        aside {
            width: 260px;
            background: var(--dark);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 30px 15px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
            min-height: 100vh;
        }
        aside h2 {
            font-size: 1.4rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 35px;
            font-weight: 900;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .nav-link.active {
            background: var(--primary);
            color: var(--dark);
        }

        main { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto;
            background-color: #fcfcfc;
        }
        
        .section-view { 
            display: none; 
        }
        .section-view.active { 
            display: block; 
        }
        .admin-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 35px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h3 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; font-weight: 800; color: #1e293b; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            gap: 20px;
            align-items: end;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 35px;
        }

        /* Centralizador para a caixa de login */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }

        #login-admin { 
            width: 100%;
            max-width: 380px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0; 
        }

        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-grupo { display: flex; flex-direction: column; }
        .form-grupo label { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #475569; }
        .form-grupo input, .form-grupo select { 
            padding: 12px 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fff;
        }

        .grid-produtos { display: flex; flex-direction: column; gap: 14px; }
        
        .card-produto { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            background: #fff;
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            transition: all 0.2s;
        }
        .card-produto:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
        .card-produto.esgotado-style { background: #f8fafc; border-left: 5px solid var(--text-muted); opacity: 0.75; }
        .card-produto.disponivel-style { border-left: 5px solid var(--success); }

        .card-pedido {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            border-left: 6px solid var(--primary);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .btn-acao { 
            background-color: var(--primary); 
            color: var(--dark); 
            border: none; 
            padding: 14px 24px; 
            font-weight: 700; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-status-toggle { 
            border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .btn-status-toggle.ativo { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .btn-status-toggle.inativo { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        
        .badge-cat {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            margin-left: 5px;
        }
        .input-preco-rapido {
            width: 80px;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Elemento de áudio original para alertas sonoros -->
    <audio id="som-notificacao" src="notificacao.mp3" preload="auto"></audio>

    <!-- CONTAINER DA TELA DE LOGIN -->
    <div class="login-wrapper" id="container-login-view">
        <div id="login-admin">
            <h2 style="text-align: center; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;">🔒 Gestão Executiva</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 30px;">Sabor Cearense Delivery</p>
            <div class="form-grupo" style="margin-bottom: 15px;">
                <label>Usuário Administrativo</label>
                <input type="text" id="usuario-login" placeholder="Ex: admin">
            </div>
            <div class="form-grupo" style="margin-bottom: 25px;">
                <label>Senha de Acesso</label>
                <input type="password" id="senha-login" placeholder="••••••••">
            </div>
            <button class="btn-acao" onclick="autenticarAdmin()" style="width: 100%; justify-content: center; display: flex;">Autenticar no Painel</button>
        </div>
    </div>

    <!-- WRAPPER DO PAINEL PRINCIPAL -->
    <div class="admin-wrapper" id="painel-adm-wrapper" style="display: none;">
        <aside id="menu-lateral" style="position: relative;">
            <h2>Sabor Cearense</h2>
            <div class="nav-link active" id="tab-ativos" onclick="alternarAbasAdmin('ativos')"><i class="fas fa-motorcycle"></i> Em Andamento</div>
            <div class="nav-link" id="tab-historico" onclick="alternarAbasAdmin('historico')"><i class="fas fa-clock-rotate-left"></i> Histórico / Finalizados</div>
            <div class="nav-link" id="tab-cardapio" onclick="alternarAbasAdmin('cardapio')"><i class="fas fa-utensils"></i> Alteração do Cardápio</div>
            
            <!-- Bloco fixado na base com linha divisória corporativa -->
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 15px; background: var(--dark); border-top: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;">
                <a href="index.html?admin=1" class="nav-link" style="color: var(--primary); background: rgba(255,255,255,0.03); font-weight: bold; margin-bottom: 0; justify-content: center;">
                    <i class="fas fa-shop"></i> Ver Cardápio
                </a>
            </div>
        </aside>

        <main id="conteudo-painel">
            <!-- ABA 1: PEDIDOS EM ANDAMENTO -->
            <section id="sec-ativos" class="section-view active">
                <div class="admin-header">
                    <h2>🛵 Pedidos em Andamento (Tempo Real)</h2>
                </div>
                
                <!-- CONTAINER INTEGRADO PARA CARDS DO WEBSOCKET -->
                <div id="container-novos-pedidos" style="margin-bottom: 20px; display: none;">
                    <div id="lista-cards-ws"></div>
                </div>

                <div id="lista-pedidos-ativos" style="display: flex; flex-direction: column; gap: 15px;"></div>
            </section>

            <!-- ABA 2: HISTÓRICO DE FINALIZADOS -->
            <section id="sec-historico" class="section-view">
                <div class="admin-header">
                    <h2>✅ Histórico de Pedidos Finalizados</h2>
                </div>
                <div id="lista-pedidos-finalizados" style="display: flex; flex-direction: column; gap: 15px;"></div>
            </section>

            <!-- ABA 3: ALTERAÇÃO DO CARDÁPIO -->
            <section id="sec-cardapio" class="section-view">
                <div class="admin-header">
                    <h2>📋 Produtos Cadastrados e Alteração Ágil</h2>
                </div>
                
                <h3>➕ Adicionar Novo Item</h3>
                <form id="form-novo-prato" class="form-grid">
                    <div class="form-grupo">
                        <label for="nome">Nome do Item</label>
                        <input type="text" id="nome" required placeholder="Ex: Baião de Dois">
                    </div>
                    <div class="form-grupo">
                        <label for="preco">Preço de Venda (R$)</label>
                        <input type="number" step="0.01" id="preco" required placeholder="0.00">
                    </div>
                    <div class="form-grupo">
                        <label for="imagem">URL da Imagem</label>
                        <input type="text" id="imagem" placeholder="https://link-da-foto.com">
                    </div>
                    <div class="form-grupo">
                        <label for="categoria">Definir Categoria</label>
                        <select id="categoria" required>
                            <option value="PRATOS_DO_DIA">🌹 Pratos do Dia</option>
                            <option value="FRANGO">🐔 Pratos Principais - Frango</option>
                            <option value="CARNE">🥩 Pratos Principais - Carne</option>
                            <option value="OUTROS">🐟 Pratos Principais - Outros</option>
                            <option value="SOBREMESA">😋 Sobremesas</option>
                            <option value="BEBIDA">🥤 Bebidas Geladas</option>
                        </select>
                    </div>
                    <div style="grid-column: span 4; text-align: right; margin-top: 10px;">
                        <button type="submit" class="btn-acao">Salvar Produto no Banco 🌵</button>
                    </div>
                </form>

                <div id="lista-itens-admin" class="grid-produtos"></div>
            </section>
        </main>
    </div>
    
   <script src="admin.js"></script>

</body>
</html>
