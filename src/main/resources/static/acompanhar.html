<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido - Sabor Cearense</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #fffcf5; color: #111111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px 20px; margin: 0; }
        .container-status { max-width: 550px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; text-align: center; }
        h2 { color: #f5a623; font-weight: 800; margin-bottom: 25px; }
        
        .box-busca {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        .box-busca input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }
        .box-busca button {
            background: #f5a623;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .box-busca button:hover { background: #e0941f; }

        .pedido-id { background: #edf2f7; display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-bottom: 30px; }
        .status-atual { font-size: 1.4rem; font-weight: 800; margin: 20px 0; color: #2d3748; }
        .linha-tempo { display: flex; justify-content: space-between; position: relative; margin: 40px 0; padding: 0 10px; }
        .linha-tempo::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 4px; background: #e2e8f0; z-index: 1; }
        .passo { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 60px; }
        .circulo { width: 34px; height: 34px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #718096; border: 3px solid #ffffff; transition: all 0.3s; }
        .legenda { font-size: 0.75rem; font-weight: bold; color: #a0aec0; margin-top: 8px; white-space: nowrap; }
        
        .passo.concluido .circulo { background: #27ae60; color: white; }
        .passo.concluido .legenda { color: #27ae60; }
        .passo.atual .circulo { background: #f5a623; color: white; box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.25); }
        .passo.atual .legenda { color: #f5a623; font-size: 0.8rem; }
        
        .btn-atualizar { background-color: #f5a623; color: #111111; border: none; padding: 14px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; transition: background 0.2s; font-size: 1rem; }
        .btn-atualizar:hover { background-color: #e0941f; }
    </style>
</head>
<body>

    <div class="container-status">
        <h2>🌵 Rastreamento do Pedido 🌵</h2>
        
        <!-- BUSCADOR DE SESSÃO FLEXÍVEL -->
        <div class="box-busca">
            <input type="number" id="input-busca-id" placeholder="Digite o Nº do seu Pedido">
            <button onclick="buscarNovoPedido()">Buscar</button>
        </div>

        <div class="pedido-id" id="area-id">Pedido #<span id="txt-pedido-id">...</span></div>
        
        <div class="linha-tempo">
            <div id="passo-RECEBIDO" class="passo">
                <div class="circulo">1</div>
                <div class="legenda">Recebido</div>
            </div>
            <div id="passo-PREPARO" class="passo">
                <div class="circulo">2</div>
                <div class="legenda">Preparo</div>
            </div>
            <div id="passo-ENTREGA" class="passo">
                <div class="circulo">3</div>
                <div class="legenda">A caminho</div>
            </div>
            <div id="passo-ENTREGUE" class="passo">
                <div class="circulo">4</div>
                <div class="legenda">Entregue</div>
            </div>
        </div>

        <div class="status-atual" id="txt-status-nome">Insira o número do pedido acima...</div>
        <p style="color: #718096; font-size: 0.9rem; margin-bottom: 25px;">Acompanhe o status real das suas entregas do Sabor Cearense.</p>
        
        <button class="btn-atualizar" onclick="consultarStatus()"><i class="fas fa-rotate"></i> Atualizar Status</button>
        <br><br>
        <a href="index.html?admin=1" style="color: #f5a623; font-weight: bold; text-decoration: none; font-size: 0.9rem;">Ir para o Cardápio</a>
    </div>
    <script>
    // 1. Definição da URL oficial do seu backend no Render
    const URL_BACKEND = "https://saborcearense-5.onrender.com";

    // 2. Captura o ID vindo da gaveta (URL) ou do localStorage anterior
    const urlParams = new URLSearchParams(window.location.search);
    let idDaUrl = urlParams.get('id');

    let pedidoId = idDaUrl || localStorage.getItem("ultimoPedidoIdSaborCearense");

    document.addEventListener("DOMContentLoaded", () => {
        if (pedidoId) {
            // Sincroniza o ID no localStorage para persistência
            localStorage.setItem("ultimoPedidoIdSaborCearense", pedidoId);
            
            if (document.getElementById("txt-pedido-id")) {
                document.getElementById("txt-pedido-id").innerText = `#${pedidoId}`;
            }
            if (document.getElementById("input-busca-id")) {
                document.getElementById("input-busca-id").value = pedidoId;
            }
            
            // Executa a primeira busca imediatamente ao carregar
            consultarStatus();
            
            // Configura a ATUALIZAÇÃO EM TEMPO REAL (Polling) a cada 7 segundos
            setInterval(consultarStatus, 7000);
        } else {
            const elementoStatus = document.getElementById("txt-status-nome") || document.getElementById("txt-index-status");
            if (elementoStatus) {
                elementoStatus.innerText = "Insira o número do pedido acima para rastrear.";
            }
        }
    });

    function buscarNovoPedido() {
        const inputElement = document.getElementById("input-busca-id");
        if (!inputElement) return;

        const inputVal = inputElement.value.trim();
        if (!inputVal) {
            alert("Por favor, digite um número de pedido válido.");
            return;
        }
        
        // Salva a nova pesquisa
        pedidoId = inputVal.replace('#', '').trim();
        localStorage.setItem("ultimoPedidoIdSaborCearense", pedidoId);
        
        if (document.getElementById("txt-pedido-id")) {
            document.getElementById("txt-pedido-id").innerText = `#${pedidoId}`;
        }
        
        consultarStatus();
    }

    // AQUI ESTÁ O ASYNC QUE EVITA O ERRO DO AWAIT:
    async function consultarStatus() {
        if (!pedidoId) return;
        try {
            const idLimpo = pedidoId.toString().replace('#', '').trim();
            
            const res = await fetch(`${URL_BACKEND}/api/pedidos/${idLimpo}`);
            if (res.ok) {
                const pedido = await res.json();
                
                if (document.getElementById("txt-pedido-id")) {
                    document.getElementById("txt-pedido-id").innerText = `#${idLimpo}`;
                }

                // Atualiza a interface visual da linha do tempo
                atualizarInterfaceLinhaTempo(pedido.status);
                
                // Atualiza o horário do último recebimento de sinal (Tempo Real)
                const txtAtt = document.getElementById("txt-ultima-att");
                if (txtAtt) {
                    const agora = new Date();
                    txtAtt.innerText = agora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                }
                
            } else if (res.status === 404) {
                const elementoStatus = document.getElementById("txt-status-nome") || document.getElementById("txt-index-status");
                if (elementoStatus) {
                    elementoStatus.innerText = "Pedido não localizado no sistema.";
                }
                limparLinhaTempo();
            }
        } catch (e) { 
            console.error("Erro ao buscar status:", e); 
        }
    }

    function atualizarInterfaceLinhaTempo(statusOriginal) {
        const ordens = ["RECEBIDO", "PREPARO", "ENTREGA", "ENTREGUE"];
        
        const dicionarioNomes = {
            "RECEBIDO": "👍 Seu pedido foi recebido com sucesso!",
            "PREPARO": "👨‍🍳 O chef já está preparando o seu prato!",
            "ENTREGA": "🛵 O motoboy pegou o rumo e já está a caminho!",
            "ENTREGUE": "✅ Pedido entregue! O Sabor Cearense agradece."
        };

        let statusDoBanco = statusOriginal ? statusOriginal.toUpperCase() : "RECEBIDO";
        if (statusDoBanco === "PREPARANDO") statusDoBanco = "PREPARO";
        if (statusDoBanco === "SAIU_ENTREGA") statusDoBanco = "ENTREGA";

        const txtStatus = document.getElementById("txt-index-status") || document.getElementById("txt-status-nome");
        if (txtStatus) {
            txtStatus.innerText = dicionarioNomes[statusDoBanco] || statusDoBanco;
        }

        const indexAtual = ordens.indexOf(statusDoBanco);

        ordens.forEach((st, idx) => {
            const elemento = document.getElementById("p-" + st) || 
                             document.getElementById("step-" + st) || 
                             document.getElementById("step-" + (st === "PREPARO" ? "PREPARANDO" : st === "ENTREGA" ? "SAIU_ENTREGA" : st));
                             
            if (!elemento) return;
            
            elemento.classList.remove("concluido", "atual", "completed", "active");
            
            if (idx < indexAtual) {
                elemento.classList.add("concluido", "completed");
            } else if (idx === indexAtual) {
                elemento.classList.add("atual", "active");
            }
        });
    }

    function limparLinhaTempo() {
        const ordens = ["RECEBIDO", "PREPARO", "ENTREGA", "ENTREGUE"];
        ordens.forEach(st => {
            const elemento = document.getElementById("p-" + st) || document.getElementById("step-" + st);
            if (elemento) {
                elemento.classList.remove("concluido", "atual", "completed", "active");
            }
        });
    }
</script>

</body>
</html>
