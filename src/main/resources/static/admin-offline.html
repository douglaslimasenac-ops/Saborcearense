<!DOCTYPE html>

<head>

    <title>Sem conexão - Sabor Cearense</title>
    <style>

        button { padding: 12px 22px; border: 0; border-radius: 9px; background: #f5a623; color: #141414; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Sabor Cearense</h1>
