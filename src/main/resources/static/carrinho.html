<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sabor Cearense</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        :root {
            --primary: #f5a623;
            --dark: #111111;
            --bg: #fffcf5;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --success: #27ae60;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 20px;
            margin: 0;
        }

        .container-checkout {
            max-width: 650px;
            margin: 0 auto;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #718096;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .btn-voltar:hover {
            color: var(--dark);
        }

        .secao-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 12px;
        }

        .item-resumo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }
        .item-resumo:last-child {
            border-bottom: none;
        }
        .item-nome {
            font-weight: 600;
            color: var(--dark);
        }
        .item-qtd-tag {
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 6px;
            font-weight: bold;
        }
        .item-preco-sub {
            font-weight: 700;
            color: #4a5568;
        }
        .total-container {
            background: #fffdf5;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 15px;
        }
        .total-preco {
            font-size: 1.4rem;
            color: var(--success);
        }

        .form-grupo {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }
        .form-grupo label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #4a5568;
        }
        .form-grupo input, .form-grupo select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fafafa;
        }
        .form-grupo input:focus, .form-grupo select:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        .btn-enviar {
            background-color: var(--primary);
            color: var(--dark);
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-enviar:hover {
            background-color: #e0941f;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(245, 166, 35, 0.4);
        }

        .box-pix {
            background: #f0fdf4;
            border: 1px dashed #bbf7d0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container-checkout">
        <a href="index.html" class="btn-voltar">← Voltar para o Cardápio</a>
        
        <div class="secao-card">
            <h2>🛒 Itens Selecionados</h2>
            <div id="lista-itens-carrinho"></div>
            
            <div class="total-container">
                <span>Valor Total:</span>
                <span id="valor-total" class="total-preco">R$ 0,00</span>
            </div>
        </div>

        <form id="form-pedido">
            <div class="secao-card">
                <h2>👤 Passo 1: Seus Dados de Entrega</h2>
                <div class="form-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite o nome de quem vai receber">
                </div>

                <div class="form-grupo">
                    <label for="telefone">WhatsApp / Telefone de Contato</label>
                    <input type="tel" id="telefone" required placeholder="Ex: (21) 99999-9999">
                </div>

                <div class="form-grupo">
    <label for="bairro-entrega">Selecione o Bairro de Entrega</label>
    <select id="bairro-entrega" required onchange="atualizarTaxaEntrega(this.value)">
        <option value="" disabled selected>Escolha o seu bairro...</option>
        <option value="Engenho Novo|0.00">Engenho Novo - R$ 0,00</option>
        <option value="Méier|3.00">Fátima - R$ 3,00</option>
        <option value="Grajaú|5.00">Grajaú - R$ 5,00</option>
        <option value="Andaraí|6.00">Andaraí - R$ 6,00</option>
        <option value="Tijuca|7.00">Tijuca - R$ 7,00</option>
        <option value="Cachambi|5.00">Cachambi - R$ 5,00</option>   
    </select>
</div>

<div class="form-grupo">
    <label for="endereco">Rua, Número, Bloco ou Apto</label>
    <input type="text" id="endereco" required placeholder="Ex: Rua São Paulo, 123 - Bloco B Apto 202">
</div>


                <div class="form-grupo">
                    <label for="ponto-referencia">Ponto de Referência (Opcional)</label>
                    <input type="text" id="ponto-referencia" placeholder="Ex: Próximo ao mercadinho ou praça">
                </div>
            </div>
            <div class="secao-card">
                <h2>💳 Passo 2: Forma de Pagamento</h2>
                <div class="form-grupo">
                    <label for="pagamento">Escolha como deseja pagar:</label>
                    <select id="pagamento" required onchange="controlarExibicaoPix(this.value)">
                        <option value="Pix">Pix (Copia e Cola Direto no Site)</option>
                        <option value="Dinheiro">Dinheiro (Pagar na Entrega)</option>
                        <option value="Cartão de Crédito">Cartão de Crédito (Na Entrega)</option>
                        <option value="Cartão de Débito">Cartão de Débito (Na Entrega)</option>
                    </select>
                </div>

                <div id="container-pix-dinamico" class="box-pix" style="display: block;">
                    <p style="margin: 0 0 8px 0; font-weight: bold; color: #166534; font-size: 0.95rem;">🔑 Chave CNPJ do Sabor Cearense:</p>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chave-pix-texto" value="21974720736" readonly style="flex: 1; padding: 10px; border: 1px solid #bbf7d0; border-radius: 6px; font-weight: bold; text-align: center; background: #fff; color: #166534;">
                        <button type="button" onclick="copiarChavePix()" style="background: #22c55e; color: white; border: none; padding: 0 15px; font-weight: bold; border-radius: 6px; cursor: pointer;">Copiar</button>
                    </div>
                    <p style="margin: 8px 0 0 0; font-size: 0.8rem; color: #166534;">💡 Copie o número acima, faça a transferência no seu banco e clique no botão abaixo para nos enviar o comprovante!</p>
                </div>
                
                <div style="margin-top: 25px;">
                    <button type="submit" class="btn-enviar">Finalizar e Enviar para o WhatsApp 🌵</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const URL_API_BACKEND = ""; 
        const WHATSAPP_NUMERO = "/5521974720736"; 
        let totalCalculado = 0;

        // 1. Cria uma variável global para o carrinho nesta página
let carrinho = {};

document.addEventListener("DOMContentLoaded", () => {
    // 2. Busca o que salvamos na página anterior
    const dadosSalvos = localStorage.getItem('saborCearense_carrinho');
    
    if (dadosSalvos) {
        // Converte o texto de volta para o objeto de itens
        carrinho = JSON.parse(dadosSalvos);
    } else {
        alert("Sua sacola está vazia!");
        window.location.href = "index.html";
        return;
    }

    // 3. Agora sim executa as suas funções originais
    renderizarResumo();
    document.getElementById("form-pedido").addEventListener("submit", enviarPedido);
});


        function controlarExibicaoPix(opcao) {
            const box = document.getElementById("container-pix-dinamico");
            if (box) {
                box.style.display = (opcao === "Pix") ? "block" : "none";
            }
        }

        function copiarChavePix() {
            const inputChave = document.getElementById("chave-pix-texto");
            if (inputChave) {
                inputChave.select();
                inputChave.setSelectionRange(0, 99999);
                navigator.clipboard.writeText(inputChave.value);
                alert("Chave Pix copiada com sucesso! Só colar no app do seu banco.");
            }
        }

        function renderizarResumo() {
    const container = document.getElementById("lista-itens-carrinho");
    const totalTxt = document.getElementById("valor-total");
    
    // 1. Pega o objeto salvo do localStorage
    const carrinhoObjeto = JSON.parse(localStorage.getItem("carrinhoSaborCearense")) || {};

    // 2. Transforma o Objeto em um Array (Lista) para não quebrar o seu código existente
    const itens = Object.values(carrinhoObjeto);

    // 3. Verifica se a lista está vazia
    if (itens.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #718096; margin: 20px 0;">Seu carrinho está vazio no momento.</p>`;
        totalTxt.innerText = "R$ 0,00";
        return;
    }

    // 4. Limpa o container antes de listar
    container.innerHTML = "";
    let totalAcumulado = 0;

    // 5. Agora o seu .forEach vai funcionar perfeitamente sem erros!
    itens.forEach(item => {
        // Calcula o valor total deste item (preço x quantidade)
        const subtotalItem = item.preco * item.quantidade;
        totalAcumulado += subtotalItem;

        // Injeta o HTML de cada prato escolhido na lista do carrinho
        container.innerHTML += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7;">
                <div>
                    <h4 style="margin: 0; font-size: 16px; color: #2d3748;">${item.nome}</h4>
                    <span style="font-size: 14px; color: #718096;">Qtd: ${item.quantidade}</span>
                </div>
                <span style="font-weight: 600; color: #2d3748;">R$ ${subtotalItem.toFixed(2).replace('.', ',')}</span>
            </div>
        `;
    });

    // 6. Atualiza o valor total geral na tela
    totalTxt.innerText = `R$ ${totalAcumulado.toFixed(2).replace('.', ',')}`;
}


function atualizarTaxaEntrega(valorSelect) {
    if (!valorSelect) return;
    const partes = valorSelect.split("|");
    bairroTextoSelecionado = partes[0];
    taxaEntregaSelecionada = parseFloat(partes[1]);
    
    // Atualiza a exibição do total somando o valor dos pratos com a taxa de entrega
    const totalComTaxa = totalCalculado + taxaEntregaSelecionada;
    document.getElementById("valor-total").innerText = `R$ ${totalComTaxa.toFixed(2).replace('.', ',')} (com R$ ${taxaEntregaSelecionada.toFixed(2).replace('.', ',')} de entrega)`;
}

        // ATENÇÃO: Deixe estas duas variáveis fora de qualquer função (no escopo global do script)
let taxaEntregaSelecionada = 0;
let bairroTextoSelecionado = "";

function atualizarTaxaEntrega(valorSelect) {
    if (!valorSelect) return;
    const partes = valorSelect.split("|");
    bairroTextoSelecionado = partes[0];
    taxaEntregaSelecionada = parseFloat(partes[1]);
    
    // Atualiza a exibição do total somando o valor dos pratos com a taxa de entrega
    const totalComTaxa = totalCalculado + taxaEntregaSelecionada;
    document.getElementById("valor-total").innerText = `R$ ${totalComTaxa.toFixed(2).replace('.', ',')} (com R$ ${taxaEntregaSelecionada.toFixed(2).replace('.', ',')} de entrega)`;
}

// SUA FUNÇÃO ENVIAR PEDIDO TOTALMENTE CORRIGIDA:
async function enviarPedido(e) {
    e.preventDefault();

    const agora = new Date();
    const diaSemana = agora.getDay();
    const minutosAtuais = (agora.getHours() * 60) + agora.getMinutes();
    
    // Captura se você está no modo admin pela URL ou se veio do index com o parâmetro
    const parametrosUrl = new URLSearchParams(window.location.search);
    const modoAdminSecreto = parametrosUrl.get("admin") === "1" || localStorage.getItem("adminAutenticado") === "true";

    // Se estiver fora do horário de entregas
    if (diaSemana === 0 || minutosAtuais < (11 * 60 + 30) || minutosAtuais > (15 * 60)) {
        // Se NÃO for o administrador, bloqueia. Se for o admin, ele deixa passar o teste!
        if (!modoAdminSecreto) {
            alert("Desculpe! O restaurante acabou de fechar o expediente de entregas. Não é possível enviar ou fechar novos pedidos agora.");
            return;
        }
    }

    // Validação do Bairro e da Taxa
    const bairroSelect = document.getElementById("bairro-entrega").value;
    if (!bairroSelect) { 
        alert("Por favor, selecione o bairro de entrega!"); 
        return; 
    }

    const itens = JSON.parse(localStorage.getItem("carrinhoSaborCearense")) || [];
    if (itens.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
    }

    const nome = document.getElementById("nome").value;
    const contatoTelefone = document.getElementById("telefone").value;
    const enderecoRua = document.getElementById("endereco").value;
    const ref = document.getElementById("ponto-referencia").value || "Não informado";
    const pagamento = document.getElementById("pagamento").value;

    const enderecoCompleto = `${enderecoRua}, Bairro: ${bairroTextoSelecionado}`;
    const totalComTaxaGeral = totalCalculado + taxaEntregaSelecionada;

    const dadosPedido = {
        clienteNome: nome,
        endereco: enderecoCompleto + " (Tel: " + contatoTelefone + ") (Ref: " + ref + ")",
        formaPagamento: pagamento,
        valorTotal: totalComTaxaGeral // Envia o total exato corrigido com a taxa para o banco Java
    };

    try {
        const response = await fetch(URL_API_BACKEND + "/api/pedidos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dadosPedido)
        });

        let pedidoIdGerado = "NOVO";
        if (response.ok) {
            const pedidoSalvo = await response.json();
            pedidoIdGerado = pedidoSalvo.id;
            localStorage.setItem("ultimoPedidoIdSaborCearense", pedidoIdGerado);
        }

        // Montagem da mensagem estruturada profissional do WhatsApp com taxa embutida
        let mensagem = "🌵 *NOVO PEDIDO - SABOR CEARENSE* 🌵\n\n";
        if (pedidoIdGerado !== "NOVO") {
            mensagem += "🆔 *Pedido Nº:* #" + pedidoIdGerado + "\n";
        }
        mensagem += "👤 *Cliente:* " + nome + "\n";
        mensagem += "📞 *Contato:* " + contatoTelefone + "\n";
        mensagem += "📍 *Bairro:* " + bairroTextoSelecionado + "\n";
        mensagem += "🏠 *Endereço:* " + enderecoRua + "\n";
        mensagem += "🔍 *Referência:* " + ref + "\n";
        mensagem += "💳 *Pagamento:* " + pagamento + "\n\n";
        mensagem += "🛒 *Itens do Pedido:*\n";

        itens.forEach(item => {
            const subtotal = (item.preco * item.quantidade).toFixed(2).replace('.', ',');
            mensagem += "• " + item.quantidade + "x _" + item.nome + "_ - R$ " + subtotal + "\n";
        });

        mensagem += "\n🛵 *Taxa de Entrega:* R$ " + taxaEntregaSelecionada.toFixed(2).replace('.', ',');
        mensagem += "\n💰 *Total do Pedido:* R$ " + totalComTaxaGeral.toFixed(2).replace('.', ',') + "\n\n";
        mensagem += "_Por favor, confirme o recebimento do meu pedido!_";

        const urlWhatsapp = "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(mensagem);
        
        window.open(urlWhatsapp, '_blank');
        localStorage.removeItem("carrinhoSaborCearense");
        window.location.href = "index.html?admin=1&aba=RASTREIO"; // Redireciona direto para a nova aba integrada de rastreio

    } catch (error) {
        console.error("Erro no processamento do pedido:", error);
        alert("Ocorreu uma falha ao enviar o pedido para o servidor, mas você pode tentar reenviar.");
    }
}
    </script>
</body>
</html>
