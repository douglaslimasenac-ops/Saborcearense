<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Cearense - Fechamento do Pedido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛒 Meu Carrinho</h1>
        <p class="subtitle">Revise seus itens e confirme os dados de entrega</p>
    </header>

    <main class="container">
        <!-- BOTÃO VOLTAR -->
        <a href="index.html" class="btn-voltar">⬅ Voltar ao Cardápio</a>

        <!-- RESUMO DOS ITENS ESCOLHIDOS -->
        <section class="form-section">
            <h2>📋 Itens Selecionados</h2>
            <div id="lista-carrinho-revisao"></div>
        </section>
        
        <!-- IDENTIFICAÇÃO DO CLIENTE -->
        <section class="form-section">
            <h2>👤 Identificação</h2>
            <div class="input-group text-input">
                <input type="tel" id="telefone" placeholder="Telefone com DDD (Ex: 85999999999)" required onblur="buscarCadastroPorTelefone()">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
            </div>
        </section>

        <!-- CONFIGURAÇÕES DE ENTREGA -->
        <section class="form-section">
            <h2>🛵 Entrega ou Retirada</h2>
            <div class="input-group text-input">
                <select id="tipoEntrega" onchange="alternarTipoEntrega()" required>
                    <option value="Entrega" selected>Receber em Casa (Entrega)</option>
                    <option value="Retirada">Retirar na Loja</option>
                </select>
            </div>

            <div id="blocoEndereco">
                <h2>📍 Endereço de Entrega</h2>
                <div class="input-group text-input">
                    <select id="bairro" onchange="calcularValoresFinais()" required>
                        <option value="">Selecione o seu Bairro</option>
                        <option value="Centro">Centro - R$ 5,00</option>
                        <option value="Aldeota">Aldeota - R$ 7,00</option>
                        <option value="Meireles">Meireles - R$ 8,00</option>
                        <option value="Fatima">Fátima - R$ 6,00</option>
                        <option value="Parquelanda">Parquelanda - R$ 9,00</option>
                    </select>
                    <input type="text" id="endereco" placeholder="Rua, Número, Bloco, Apto" required>
                </div>
            </div>

            <h2>📝 Observações Gerais</h2>
            <div class="input-group text-input">
                <input type="text" id="acompanhamentos" placeholder="Acompanhamentos (Ex: Maionese e Batata frita)">
                <textarea id="observacoes" rows="2" placeholder="Ex: Sem cebola, bife bem passado..."></textarea>
            </div>

            <h2>💳 Forma de Pagamento</h2>
            <div class="input-group text-input">
                <select id="pagamento" required>
                    <option value="">Selecione a Forma de Pagamento</option>
                    <option value="Pix">Pix (CNPJ: 59361228000150)</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão Crédito/Débito</option>
                </select>
            </div>

            <!-- TABELA DE VALORES FINAIS -->
            <div class="resumo-valores">
                <div class="linha-valor"><span>Subtotal itens:</span> <span id="val-subtotal">R$ 0,00</span></div>
                <div class="linha-valor"><span>Taxa de entrega:</span> <span id="val-taxa">R$ 0,00</span></div>
                <div class="linha-valor total-geral"><span>TOTAL GERAL:</span> <span id="val-total">R$ 0,00</span></div>
            </div>

            <button onclick="finalizarEPushPedido()" class="btn-submit">🚀 Confirmar e Enviar Pedido</button>
        </section>
    </main>
    <script>
        const taxasBairros = { "Centro": 5.0, "Aldeota": 7.0, "Meireles": 8.0, "Fatima": 6.0, "Parquelanda": 9.0 };
        let itensCarrinho = [];
        let subtotalItens = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const dadosSalvos = localStorage.getItem('carrinho_itens');
            if (!dadosSalvos) {
                alert("Nenhum item no carrinho!");
                window.location.href = "index.html";
                return;
            }

            itensCarrinho = JSON.parse(dadosSalvos);
            const containerRevisao = document.getElementById('lista-carrinho-revisao');
            
            itensCarrinho.forEach(item => {
                const sub = item.preco * item.quantidade;
                subtotalItens += sub;
                containerRevisao.innerHTML += `
                    <div class="linha-revisao-item">
                        <span><strong>${item.quantidade}x</strong> ${item.nome}</span>
                        <span>R$ ${sub.toFixed(2)}</span>
                    </div>`;
            });

            if(localStorage.getItem('cliente_telefone')) {
                document.getElementById('telefone').value = localStorage.getItem('cliente_telefone');
                document.getElementById('nome').value = localStorage.getItem('cliente_nome');
                document.getElementById('endereco').value = localStorage.getItem('cliente_endereco');
                document.getElementById('bairro').value = localStorage.getItem('cliente_bairro') || "";
            }

            calcularValoresFinais();
        });

        function alternarTipoEntrega() {
            const tipo = document.getElementById('tipoEntrega').value;
            document.getElementById('blocoEndereco').style.display = (tipo === 'Retirada') ? 'none' : 'block';
            if (tipo === 'Retirada') {
                document.getElementById('bairro').value = "";
                document.getElementById('endereco').value = "";
            }
            calcularValoresFinais();
        }

        function calcularValoresFinais() {
            const tipoEntrega = document.getElementById('tipoEntrega').value;
            const bairro = document.getElementById('bairro').value;
            let taxa = (tipoEntrega === 'Entrega' && bairro) ? (taxasBairros[bairro] || 0) : 0;
            let total = subtotalItens + taxa;

            document.getElementById('val-subtotal').innerText = "R\$ " + subtotalItens.toFixed(2);
            document.getElementById('val-taxa').innerText = taxa > 0 ? "R\$ " + taxa.toFixed(2) : "Grátis / Retirada";
            document.getElementById('val-total').innerText = "R\$ " + total.toFixed(2);
        }

        function buscarCadastroPorTelefone() {
            const t = document.getElementById('telefone').value.replace(/\D/g, '');
            if(t.length < 10) return;
            fetch(`/api/clientes/${t}`).then(res => res.json()).then(c => {
                document.getElementById('nome').value = c.nome;
                document.getElementById('endereco').value = c.endereco;
                if(c.bairro) document.getElementById('bairro').value = c.bairro;
                calcularValoresFinais();
            }).catch(() => {});
        }

        async function finalizarEPushPedido() {
            const numeroWhatsapp = "5521974720736";
            const telefone = document.getElementById('telefone').value;
            const nomeCliente = document.getElementById('nome').value;
            const tipoEntrega = document.getElementById('tipoEntrega').value;
            const pagamento = document.getElementById('pagamento').value;
            const bairro = document.getElementById('bairro').value;
            const endereco = document.getElementById('endereco').value;
            const acompanhamentos = document.getElementById('acompanhamentos').value || "Nenhum";
            const observacoes = document.getElementById('observacoes').value || "Nenhuma";

            if (!telefone || !nomeCliente || !pagamento) return alert("Preencha a Identificação e o Pagamento!");
            if (tipoEntrega === 'Entrega' && (!bairro || !endereco)) return alert("Preencha o Bairro e o Endereço de entrega!");

            let taxa = tipoEntrega === 'Entrega' ? (taxasBairros[bairro] || 0) : 0;
            let totalGeral = subtotalItens + taxa;

            localStorage.setItem('cliente_telefone', telefone);
            localStorage.setItem('cliente_nome', nomeCliente);
            localStorage.setItem('cliente_endereco', endereco);
            localStorage.setItem('cliente_bairro', bairro);

            try {
                await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone, nome: nomeCliente, endereco, bairro })
                });
            } catch (e) {}

            let resumoTextoLog = "";
            let resumoTextoZap = "";
            itensCarrinho.forEach(item => {
                resumoTextoLog += `${item.quantidade}x ${item.nome} | `;
                resumoTextoZap += `- ${item.quantidade}x ${item.nome} (R$ ${(item.preco * item.quantidade).toFixed(2)})\n`;
            });

            try {
                await fetch('/api/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente: nomeCliente, tipoEntrega, bairro, taxaEntrega: taxa, resumoItens: resumoTextoLog, total: totalGeral
                    })
                });
            } catch (e) {}

            let mensagem = `☀️ *SABOR CEARENSE - PEDIDO* ☀️\n\n` +
                           `*Cliente:* ${nomeCliente}\n` +
                           `*Telefone:* ${telefone}\n` +
                           `*Tipo:* ${tipoEntrega}\n`;
            
            if(tipoEntrega === 'Entrega') {
                mensagem += `*Bairro:* ${bairro}\n*Endereço:* ${endereco}\n`;
            }

            mensagem += `\n*Itens do Pedido:*\n${resumoTextoZap}\n` +
                        `*Acompanhamentos:* ${acompanhamentos}\n` +
                        `*Observações:* ${observacoes}\n\n` +
                        `*Pagamento:* ${pagamento}\n` +
                        `---------------------------\n` +
                        `*Subtotal itens:* R$ ${subtotalItens.toFixed(2)}\n` +
                        `*Taxa de Entrega:* R$ ${taxa.toFixed(2)}\n` +
                        `*TOTAL GERAL:* R$ ${totalGeral.toFixed(2)}`;

            localStorage.removeItem('carrinho_itens');
           window.open(`https://wa.me//{encodeURIComponent(textoWhatsapp)}`, '_blank');
        }
    </script>
</body>
</html>
