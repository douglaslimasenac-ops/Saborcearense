<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sabor Cearense</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        :root {
            --primary: #f5a623;
            --dark: #111111;
            --bg: #fffcf5;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --success: #27ae60;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 20px;
            margin: 0;
        }

        .container-checkout {
            max-width: 650px;
            margin: 0 auto;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #718096;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .btn-voltar:hover {
            color: var(--dark);
        }

        .secao-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 12px;
        }

        .item-resumo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }
        .item-resumo:last-child {
            border-bottom: none;
        }
        .item-nome {
            font-weight: 600;
            color: var(--dark);
        }
        .item-qtd-tag {
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 6px;
            font-weight: bold;
        }
        .item-preco-sub {
            font-weight: 700;
            color: #4a5568;
        }

        .total-container {
            background: #fffdf5;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 15px;
        }
        .total-preco {
            font-size: 1.4rem;
            color: var(--success);
        }

        .form-grupo {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }
        .form-grupo label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #4a5568;
        }
        .form-grupo input, .form-grupo select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fafafa;
        }
        .form-grupo input:focus, .form-grupo select:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        .btn-enviar {
            background-color: var(--primary);
            color: var(--dark);
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-enviar:hover {
            background-color: #e0941f;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(245, 166, 35, 0.4);
        }

        /* Estilo da caixa dinâmica Pix Copia e Cola */
        .box-pix {
            background: #f0fdf4;
            border: 1px dashed #bbf7d0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container-checkout">
        <a href="index.html" class="btn-voltar">← Voltar para o Cardápio</a>
        
        <!-- RESUMO DO PEDIDO -->
        <div class="secao-card">
            <h2>🛒 Itens Selecionados</h2>
            <div id="lista-itens-carrinho"></div>
            
            <div class="total-container">
                <span>Valor Total:</span>
                <span id="valor-total" class="total-preco">R$ 0,00</span>
            </div>
        </div>

        <form id="form-pedido">
            <!-- ETAPA 1: DADOS DO CLIENTE -->
            <div class="secao-card">
                <h2>👤 Passo 1: Seus Dados de Entrega</h2>
                <div class="form-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite o nome de quem vai receber">
                </div>

                <div class="form-grupo">
                    <label for="telefone">WhatsApp / Telefone de Contato</label>
                    <input type="tel" id="telefone" required placeholder="Ex: (21) 99999-9999">
                </div>

                <div class="form-grupo">
                    <label for="endereco">Endereço Completo de Entrega</label>
                    <input type="text" id="endereco" required placeholder="Rua, Número, Bloco, Apto e Bairro">
                </div>

                <div class="form-grupo">
                    <label for="ponto-referencia">Ponto de Referência (Opcional)</label>
                    <input type="text" id="ponto-referencia" placeholder="Ex: Próximo ao mercadinho ou praça">
                </div>
            </div>

            <!-- ETAPA 2: FORMAS DE PAGAMENTO -->
            <div class="secao-card">
                <h2>💳 Passo 2: Forma de Pagamento</h2>
                <div class="form-grupo">
                    <label for="pagamento">Escolha como deseja pagar:</label>
                    <select id="pagamento" required onchange="controlarExibicaoPix(this.value)">
                        <option value="Pix">Pix (Copia e Cola Direto no Site)</option>
                        <option value="Dinheiro">Dinheiro (Pagar na Entrega)</option>
                        <option value="Cartão de Crédito">Cartão de Crédito (Na Entrega)</option>
                        <option value="Cartão de Débito">Cartão de Débito (Na Entrega)</option>
                    </select>
                </div>

                <!-- BOX DO PIX DINÂMICO -->
                <div id="container-pix-dinamico" class="box-pix" style="display: block;">
                    <p style="margin: 0 0 8px 0; font-weight: bold; color: #166534; font-size: 0.95rem;">🔑 Chave CNPJ do Sabor Cearense:</p>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chave-pix-texto" value="21974720736" readonly style="flex: 1; padding: 10px; border: 1px solid #bbf7d0; border-radius: 6px; font-weight: bold; text-align: center; background: #fff; color: #166534;">
                        <button type="button" onclick="copiarChavePix()" style="background: #22c55e; color: white; border: none; padding: 0 15px; font-weight: bold; border-radius: 6px; cursor: pointer;">Copiar</button>
                    </div>
                    <p style="margin: 8px 0 0 0; font-size: 0.8rem; color: #166534;">💡 Copie o número acima, faça a transferência no seu banco e clique no botão abaixo para nos enviar o comprovante!</p>
                </div>
                
                <div style="margin-top: 25px;">
                    <button type="submit" class="btn-enviar">Finalizar e Enviar para o WhatsApp 🌵</button>
                </div>
            </div>
        </form>
    </div>
        <script>
        const URL_API_BACKEND = ""; // Caminhos nativos relativos para evitar erros no Render
        const WHATSAPP_NUMERO = "5521974720736"; // Seu WhatsApp Oficial unificado do Rio de Janeiro
        let totalCalculado = 0;

        document.addEventListener("DOMContentLoaded", () => {
            renderizarResumo();
            document.getElementById("form-pedido").addEventListener("submit", enviarPedido);
        });

        function controlarExibicaoPix(opcao) {
            const box = document.getElementById("container-pix-dinamico");
            if (box) {
                box.style.display = (opcao === "Pix") ? "block" : "none";
            }
        }

        function copiarChavePix() {
            const inputChave = document.getElementById("chave-pix-texto");
            if (inputChave) {
                inputChave.select();
                inputChave.setSelectionRange(0, 99999);
                navigator.clipboard.writeText(inputChave.value);
                alert("Chave Pix copiada com sucesso! Só colar no app do seu banco.");
            }
        }

        function renderizarResumo() {
            const container = document.getElementById("lista-itens-carrinho");
            const totalTxt = document.getElementById("valor-total");
            // Lê exatamente a chave sincronizada com a página inicial
            const itens = JSON.parse(localStorage.getItem("carrinhoSaborCearense")) || [];

            if (itens.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #718096; margin: 20px 0;">Seu carrinho está vazio no momento.</p>`;
                totalTxt.innerText = "R\$ 0,00";
                return;
            }

            container.innerHTML = "";
            totalCalculado = 0;

            itens.forEach(item => {
                const subtotalItem = item.preco * item.quantidade; 
                totalCalculado += subtotalItem;

                const div = document.createElement("div");
                div.className = "item-resumo";
                div.innerHTML = `
                    <div>
                        <span class="item-qtd-tag">${item.quantidade}x</span>
                        <span class="item-nome">${item.nome}</span>
                    </div>
                    <span class="item-preco-sub">R$ ${subtotalItem.toFixed(2).replace('.', ',')}</span>
                `;
                container.appendChild(div);
            });

            totalTxt.innerText = `R$ ${totalCalculado.toFixed(2).replace('.', ',')}`;
        }
        async function enviarPedido(e) {
            e.preventDefault();

            const itens = JSON.parse(localStorage.getItem("carrinhoSaborCearense")) || [];
            if (itens.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            const nome = document.getElementById("nome").value;
            const contatoTelefone = document.getElementById("telefone").value;
            const endereco = document.getElementById("endereco").value;
            const ref = document.getElementById("ponto-referencia").value || "Não informado";
            const pagamento = document.getElementById("pagamento").value;

            // Formata o endereço com as novas informações para enviar ao banco Java
            const dadosPedido = {
                clienteNome: nome,
                endereco: `${endereco} (Tel: ${contatoTelefone}) (Ref: ${ref})`,
                formaPagamento: pagamento,
                valorTotal: totalCalculado
            };

            try {
                // Envia e salva o pedido na API do seu Spring Boot no Render
                const response = await fetch(`${URL_API_BACKEND}/api/pedidos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dadosPedido)
                });

                let pedidoIdGerado = "NOVO";
                if (response.ok) {
                    const pedidoSalvo = await response.json();
                    pedidoIdGerado = pedidoSalvo.id;
                    localStorage.setItem("ultimoPedidoIdSaborCearense", pedidoIdGerado);
                }

                // 🌟 Construção da mensagem estruturada e limpa para o seu WhatsApp corporativo
                let mensagem = `🌵 *NOVO PEDIDO - SABOR CEARENSE* 🌵\n\n`;
                if (pedidoIdGerado !== "NOVO") {
                    mensagem += `🆔 *Pedido Nº:* #${pedidoIdGerado}\n`;
                }
                mensagem += `👤 *Cliente:* ${nome}\n`;
                mensagem += `📞 *Contato:* ${contatoTelefone}\n`;
                mensagem += `📍 *Endereço:* ${endereco}\n`;
                mensagem += `🔍 *Referência:* ${ref}\n`;
                mensagem += `💳 *Pagamento:* ${pagamento}\n\n`;
                mensagem += `🛒 *Itens do Pedido:*\n`;

                itens.forEach(item => {
                    const subtotal = (item.preco * item.quantidade).toFixed(2).replace('.', ',');
                    mensagem += `• ${item.quantidade}x _${item.nome}_ - R$ ${subtotal}\n`;
                });

                mensagem += `\n💰 *Total do Pedido:* R$ ${totalCalculado.toFixed(2).replace('.', ',')}\n\n`;
                mensagem += `_Por favor, confirme o recebimento do meu pedido!_`;

                // 🚀 Correção definitiva do redirecionamento do WhatsApp usando parâmetros oficiais text e phone
                const urlWhatsapp = `https://whatsapp.com{WHATSAPP_NUMERO}&text=${encodeURIComponent(mensagem)}`;
                window.open(urlWhatsapp, '_blank');

                // Limpa o carrinho local para evitar duplicidades nas próximas compras
                localStorage.removeItem("carrinhoSaborCearense");

                // Redireciona o cliente para a tela de linha do tempo
                window.location.href = "acompanhar.html";

            } catch (error) {
                console.error("Erro ao processar pedido:", error);
                alert("Houve uma falha de comunicação, mas você pode tentar enviar novamente.");
            }
        }
    </script>
</body>
</html>
