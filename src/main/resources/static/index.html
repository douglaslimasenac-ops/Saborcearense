<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Sabor Cearense</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body {
            background-color: #fffcf5; /* Fundo Creme/Bege Claro oficial */
            color: #111111; /* Preto Rústico oficial */
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container-carrinho {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2, h3 {
            color: #111111;
            border-bottom: 2px solid #f5a623; /* Amarelo Alaranjado oficial */
            padding-bottom: 8px;
        }
        .item-resumo {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .total-container {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: right;
            margin-top: 15px;
            color: #111111;
        }
        .form-grupo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-grupo label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-grupo input, .form-grupo select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn-enviar {
            background-color: #f5a623; /* Amarelo Alaranjado */
            color: #111111; /* Preto Rústico */
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-enviar:hover {
            background-color: #e0941f;
        }
        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            color: #f5a623;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container-carrinho">
        <a href="index.html" class="btn-voltar">← Voltar ao Cardápio</a>
        
        <h2>Seu Pedido</h2>
        <div id="lista-itens-carrinho">
            <!-- Itens injetados via JS -->
        </div>
        <div class="total-container">
            Total: <span id="valor-total">R\$ 0,00</span>
        </div>

        <h3>Dados de Entrega</h3>
        <form id="form-pedido">
            <div class="form-grupo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-grupo">
                <label for="endereco">Endereço (Rua, Número, Bairro):</label>
                <input type="text" id="endereco" required placeholder="Ex: Rua Floriano Peixoto, 123 - Centro">
            </div>

            <div class="form-grupo">
                <label for="ponto-referencia">Ponto de Referência (Opcional):</label>
                <input type="text" id="ponto-referencia" placeholder="Ex: Próximo à igreja matriz">
            </div>

            <div class="form-grupo">
                <label for="pagamento">Forma de Pagamento:</label>
                <select id="pagamento" required>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>

            <button type="submit" class="btn-enviar">Finalizar e Enviar para o WhatsApp 🌵</button>
        </form>
    </div>

    <script>
        // Configuração do WhatsApp do Restaurante (Substitua pelo número correto com DDD)
        const WHATSAPP_NUMERO = "5585999999999"; 
        let totalCalculado = 0;

        document.addEventListener("DOMContentLoaded", () => {
            renderizarResumo();
            document.getElementById("form-pedido").addEventListener("submit", enviarPedido);
        });

        function renderizarResumo() {
            const container = document.getElementById("lista-itens-carrinho");
            const totalTxt = document.getElementById("valor-total");
            
            // Lendo a chave exata gerada pelo seu index.html
            const itens = JSON.parse(localStorage.getItem("itensCarrinhoSaborCearense")) || [];

            if (itens.length === 0) {
                container.innerHTML = "<p>Seu carrinho está vazio.</p>";
                totalTxt.innerText = "R\$ 0,00";
                return;
            }

            container.innerHTML = "";
            totalCalculado = 0;

            itens.forEach(item => {
                const subtotalItem = item.preco * item.qtd; // Ajustado para .qtd conforme o seu index.html
                totalCalculado += subtotalItem;

                const div = document.createElement("div");
                div.className = "item-resumo";
                div.innerHTML = `
                    <span>${item.qtd}x ${item.nome}</span>
                    <span>R$ ${subtotalItem.toFixed(2).replace('.', ',')}</span>
                `;
                container.appendChild(div);
            });

            totalTxt.innerText = `R$ ${totalCalculado.toFixed(2).replace('.', ',')}`;
        }

        function enviarPedido(e) {
            e.preventDefault();

            const itens = JSON.parse(localStorage.getItem("itensCarrinhoSaborCearense")) || [];

            if (itens.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            const nome = document.getElementById("nome").value;
            const endereco = document.getElementById("endereco").value;
            const ref = document.getElementById("ponto-referencia").value || "Não informado";
            const pagamento = document.getElementById("pagamento").value;

            // Montagem da mensagem formatada para o WhatsApp
            let mensagem = `🌵 *NOVO PEDIDO - SABOR CEARENSE* 🌵\n\n`;
            mensagem += `👤 *Cliente:* ${nome}\n`;
            mensagem += `📍 *Endereço:* ${endereco}\n`;
            mensagem += `🔍 *Referência:* ${ref}\n`;
            mensagem += `💳 *Pagamento:* ${pagamento}\n\n`;
            mensagem += `🛒 *Itens do Pedido:*\n`;

            itens.forEach(item => {
                const subtotal = (item.preco * item.qtd).toFixed(2).replace('.', ',');
                mensagem += `• ${item.qtd}x _${item.nome}_ - R$ ${subtotal}\n`;
            });

            mensagem += `\n💰 *Total do Pedido:* R$ ${totalCalculado.toFixed(2).replace('.', ',')}\n\n`;
            mensagem += `_Aguardando confirmação do restaurante pelo painel..._`;

            const urlWhatsapp = `https://whatsapp.com{WHATSAPP_NUMERO}&text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsapp, '_blank');
        }
    </script>
</body>
</html>
