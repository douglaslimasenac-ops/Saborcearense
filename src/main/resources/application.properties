# 🎯 BANCO DE DADOS EMBUTIDO AUTOMÁTICO (Se inicializa sozinho no Render)
spring.datasource.url=jdbc:h2:mem:sabor_cearense;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do Hibernate otimizada para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# 🛠️ CORREÇÃO DEFINITIVA: Desativa completamente a busca e execução do arquivo data.sql
spring.sql.init.mode=never

# Logs para acompanhamento das queries no console do Render
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Ativa o painel visual do banco em ://onrender.com
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
